[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200
via_ir = false

# Linting and formatting
[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 1000
depth = 15
fail_on_revert = false

# Add custom scripts
[profile.default.scripts]
format = "prettier --write 'src/**/*.sol'"
lint = "solhint 'src/**/*.sol'"
check = "forge build && npm run lint"
