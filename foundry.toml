[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200
via_ir = false
block_timestamp = 1_738_368_000 # Feb 1, 2025 at 00:00 GMT

# Dependencies with specific versions for reproducible builds
[dependencies]
openzeppelin-contracts = "5.4.0"
openzeppelin-contracts-upgradeable = "5.4.0"

# Linting and formatting
[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 1000
depth = 15
fail_on_revert = false

# Add custom scripts
[profile.default.scripts]
format = "prettier --write 'src/**/*.sol'"
lint = "solhint 'src/**/*.sol'"
check = "forge build && npm run lint"
